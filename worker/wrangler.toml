# Legislative-Change Watcher (BC + Ontario) -- standalone Cloudflare Worker.
#
# This is deliberately separate from the Pages project that serves the
# rest of knowyourstrata.com: Cloudflare Pages Functions don't support
# Cron Triggers, so a scheduled job needs its own Worker.
#
# One-time setup in the Cloudflare dashboard (not done by this repo):
#   1. Workers & Pages -> Create -> connect this GitHub repo the same way
#      the Pages project is connected ("Continue with GitHub" / Workers
#      Builds), pointing the build at this "worker/" subdirectory so it
#      finds this wrangler.toml.
#   2. WATCHER_STATUS_SECRET must be a Secrets Store binding, not a plain
#      Settings -> Variables and Secrets entry -- the plain panel does not
#      reliably bind into a script deployed via Workers Builds (confirmed
#      across five separate attempts with different values, one hand-
#      typed; it never once appeared on this Worker's own Bindings tab,
#      unlike the KV namespace below, which always has):
#        a. Secrets Store (account level) -> create a secret, e.g. named
#           "watcher-status-secret", value = any long random string.
#        b. Replace the store_id and secret_name placeholders below with
#           the real values from what you created in (a).
#        c. Redeploy, then confirm WATCHER_STATUS_SECRET actually appears
#           on this Worker's Bindings tab -- that's the real signal it
#           worked, not just "saved" in the dashboard.
#   3. Confirm the KV binding below resolves to the existing
#      "knowyourstrata-watcher" namespace (id already created).
#
# After that, git push to this repo deploys the Worker automatically,
# same as Pages already does for the rest of the site.

name = "knowyourstrata-watcher"
main = "src/index.js"
compatibility_date = "2026-08-21"

[triggers]
# DAY-OF-WEEK GOTCHA, measured 2026-09-20, do not "correct" this back.
# Cloudflare schedules this field as 1 = Sunday, 2 = Monday. It is NOT the
# standard 0 = Sunday convention. "0 8 * * 1" ran every SUNDAY for four
# consecutive weeks (23 Aug, 30 Aug, 6 Sep, 13 Sep) while this comment
# claimed Monday, and the dashboard confirmed it: setting 2 displays as
# "At 08:00 AM on Monday" with the next run on Mon 21 Sep 2026.
crons = ["0 8 * * 2"]  # Weekly, MONDAY 08:00 UTC (2 = Monday here)

[[kv_namespaces]]
binding = "WATCHER_KV"
id = "6359a8114b29408f8f6b729a0cb96508"

[[secrets_store_secrets]]
binding = "WATCHER_STATUS_SECRET"
store_id = "beaccdc53cc3460ca4969c04ccb55096"
secret_name = "watcher-status-secret"
